sonar.projectKey=devops-task-api
sonar.projectName=DevOps Task API
sonar.projectVersion=1.0

# Source code directory
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js

# Test configuration
sonar.test.inclusions=tests/**/*.test.js

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Language
sonar.language=js

# Encoding
sonar.sourceEncoding=UTF-8
